<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voltyx Studios</title>
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-brand">
      <h1>Voltyx Studios</h1>
      <p>Le studio derrière Lumalia</p>
    </div>

    <div class="auth-card">
      <!-- Onglets -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Connexion</button>
        <button class="auth-tab" data-tab="register">Inscription</button>
      </div>

      <!-- Formulaire de connexion -->
      <form id="login-form" class="auth-form active">
        <label>
          Email
          <input type="email" id="login-email" required />
        </label>
        <label>
          Mot de passe
          <input type="password" id="login-password" required />
        </label>
        <button type="submit" class="btn-primary">Se connecter</button>
        <p class="auth-error" id="login-error"></p>
      </form>

      <!-- Formulaire d'inscription -->
      <form id="register-form" class="auth-form">
        <label>
          Pseudo
          <input type="text" id="register-username" required minlength="3" maxlength="20" />
        </label>
        <label>
          Email
          <input type="email" id="register-email" required />
        </label>
        <label>
          Mot de passe
          <input type="password" id="register-password" required minlength="6" />
        </label>
        <button type="submit" class="btn-primary">Créer mon compte</button>
        <p class="auth-error" id="register-error"></p>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/auth-form.js"></script>
</body>
          </html>
